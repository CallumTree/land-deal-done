name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - run: npm run test:fixtures
      - run: npm run test:scorecard
      - run: npm run test:share-link
      # Always prints the full % with homes / cause breakdown (an
      # informational report, never gates CI on its own) — exits non-
      # zero ONLY if a returned layout breaks an independently-checked
      # invariant, which is the one thing here that's a real bug.
      - run: npm run test:fuzz-shapes
