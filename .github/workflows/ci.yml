name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Next.js 16 generates the global LayoutProps/PageProps types used in
      # src/app/layout.tsx into .next/types at build time; `next build`
      # does this implicitly, but a bare `tsc --noEmit` on a clean
      # checkout (no .next/ yet) doesn't, so it needs its own typegen
      # step first. Vercel builds were green because `next build` already
      # covers this — only the standalone tsc check in CI was missing it.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - run: npm run test:fixtures
      - run: npm run test:scorecard
      - run: npm run test:share-link
      # Always prints the full % with homes / cause breakdown (an
      # informational report, never gates CI on its own) — exits non-
      # zero ONLY if a returned layout breaks an independently-checked
      # invariant, which is the one thing here that's a real bug.
      - run: npm run test:fuzz-shapes
      # Same harness, but every fuzzed shape also carries a restriction —
      # the companion suite that exercises restriction-aware placement
      # (overlapsAnyHardRestriction/overlapsEverythingRestriction) rather
      # than just plain boundaries. Same pass/fail contract as above.
      - run: npm run test:fuzz-restrictions
